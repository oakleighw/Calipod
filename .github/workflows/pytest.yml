name: pytest


on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:  # used to allow manual triggering


jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_PROGRESS_BAR: "off"
      PIP_DEFAULT_TIMEOUT: "120"

    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10','3.11']
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            path: ~/.cache/pip
          - os: macos-latest
            path: ~/Library/Caches/pip
          - os: windows-latest
            path: ~\AppData\Local\pip\Cache

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          pyproject.toml

      # Ubuntu-specific steps
    - name: Update packages (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update
    - name: Install packages (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get install --fix-missing libgl1-mesa-dev
    
    # macOS-specific steps
    - name: Set environment variables (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV
        echo "NUMEXPR_NUM_THREADS=1" >> $GITHUB_ENV
        echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade "pip<25"
        python -m pip install --retries 5 --timeout 120 -e .
        python -m pip install --retries 5 --timeout 120 ruff pytest

    - name: Lint with Ruff
      run: ruff check .
    - name: Test with pytest
      run: pytest
        